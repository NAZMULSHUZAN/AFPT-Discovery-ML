[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afpt-discovery-ml"
version = "1.2.0"
description = "Reproducible and extensible clustering workflow for antifreezing peptide discovery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Nazmul Shuzan", email = "nazmul.shuzan@my.utsa.edu"}
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "openpyxl>=3.1,<4",
  "joblib>=1.3,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
  "biopython>=1.81,<2",
  "umap-learn>=0.5,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1"
]

[project.scripts]
afpt-cluster = "afpt_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
